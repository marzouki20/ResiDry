server.port=${RESIDRY_PORT:8766}
server.address=${RESIDRY_BIND:127.0.0.1}
spring.profiles.default=local
spring.datasource.url=${RESIDRY_DB_URL:jdbc:h2:file:./data/residry;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;WRITE_DELAY=0}
spring.datasource.username=${RESIDRY_DB_USER:sa}
spring.datasource.password=${RESIDRY_DB_PASSWORD:}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
server.error.include-message=never
residry.admin.email=${RESIDRY_ADMIN_EMAIL:}
residry.admin.password=${RESIDRY_ADMIN_PASSWORD:}
residry.ai.url=${RESIDRY_AI_URL:}
residry.ai.token=${REGISTRATION_DEV_TOKEN:}
logging.level.root=INFO
logging.level.org.springframework=INFO

residry.ai.dossier-url=${RESIDRY_AI_DOSSIER_URL:}
